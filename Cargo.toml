[package]
name = "nui-yalij"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
description = "Shared terminal sessions driven by KDL state and layered decoration"
license = "MIT"
repository = "https://github.com/kindkitchen/nui-yalij"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui"]
categories = ["command-line-utilities"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**", "tests/**", "plugins/**", "skills/**"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/nui-yalij-{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[dependencies]
crossterm = { version = "0.29", features = ["serde"] }
kdl = "6"
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
nucleo-matcher = "0.3"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.18"
